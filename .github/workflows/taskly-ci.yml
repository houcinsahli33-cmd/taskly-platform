name: Taskly - controles de preproduction
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      TASKLY_MAIL_PILOT_ENABLED: 'false'
      TASKLY_MAIL_GATEWAY_ENABLED: 'false'
      TASKLY_DISABLE_LOCAL_EXPIRY_WORKER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
