<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services - Taskly</title>
  <link rel="icon" type="image/svg+xml" href="/images/icons/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/services.js"></script>
</head>
<body data-active="services">
  <div id="site-header"></div>
  <main class="page-main">
    <!-- Hero services -->
    <section class="photo-hero">
      <img src="/images/hero/home-service.jpg" alt="Artisan en intervention chez un client">
      <div class="container">
        <p class="eyebrow">Catalogue</p>
        <h1>Trouvez le service adapté à votre besoin</h1>
        <p class="lead font-700">Explorez les services disponibles, comparez les artisans et choisissez le profil qui correspond à votre projet.</p>
      </div>
    </section>

    <!-- Recherche et liste des services -->
    <section class="section">
      <div class="container">
        <div class="filters services-filter-box">
          <div class="search-shell services-search-shell">
            <form class="hero-search services-search-form" id="services-search-form">
              <input id="service-search" type="search" autocomplete="off" placeholder="Rechercher un service">
              <button class="hero-search-button" type="submit" aria-label="Rechercher">
                <img src="/images/icons/search_icon.svg" alt="">
              </button>
            </form>
          </div>

          <div class="filter-tabs mb-0">
            <button class="btn outline" type="button" data-service-filter="populaires">Services populaires</button>
            <button class="btn outline" type="button" data-service-filter="notes">Mieux notés</button>
          </div>
        </div>
        <div class="grid three" id="services-grid"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
