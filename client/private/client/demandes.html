<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes demandes — Taskly</title>
  <link rel="icon" type="image/svg+xml" href="/images/icons/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/client-dashboard.js"></script>
<link rel="stylesheet" href="/css/account-profile.css"><link rel="stylesheet" href="/css/taskly-workspace-forms.css"><script defer src="/js/account-confirmation.js"></script><link rel="stylesheet" href="/css/workspace-pro.css"><script defer src="/js/workspace-dialogs.js"></script></head>
<body class="dashboard-page" data-require-role="client" data-workspace-page="demandes">
  <div id="site-header"></div>
  <main class="dashboard-shell">
    <!-- Navigation client -->
    <aside class="sidebar">
      <p class="sidebar-title">Espace client</p>
      <nav class="side-nav"><a href="/espace/client/accueil" data-dashboard-link="accueil">Vue d’ensemble</a>
        <a href="/espace/client/demandes" class="active" aria-current="page" data-dashboard-link="demandes">Mes demandes</a>
        <a href="/espace/client/profil" data-dashboard-link="profil">Mon profil</a>
        <a href="/espace/client/support" data-dashboard-link="support">Support</a>
        <button type="button" data-logout>Déconnexion</button>
      </nav>
    </aside>

    <!-- Contenu client -->
    <section class="dashboard-content">
      <h1 class="dashboard-section-title" id="dashboard-page-title">Mes demandes</h1>
      

      

      
      <div class="dashboard-grid">
        <section class="panel" id="demandes" data-dashboard-view="demandes">
          <div class="panel-header">
            <h2>Mes demandes</h2>
          </div>
          <div class="panel-body">
            <div class="request-list" id="client-requests"></div>
          </div>
        </section>

        
      </div>
    </section>
  </main>

  <!-- Modale avis -->
  <div id="review-modal" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>Laisser un avis</h2>
        <button class="modal-close" type="button" data-close-modal="review-modal">×</button>
      </div>
      <form class="modal-body" id="review-form">
        <input type="hidden" id="review-demande-id">
        <label>
          <span class="field-label">Note</span>
          <select class="form-select" id="review-note" required>
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Très bien</option>
            <option value="3">3 - Correct</option>
            <option value="2">2 - Insuffisant</option>
            <option value="1">1 - Mauvais</option>
          </select>
        </label>
        <label>
          <span class="field-label">Commentaire</span>
          <textarea class="form-textarea" id="review-comment" placeholder="Décrivez votre expérience"></textarea>
        </label>
        <button class="btn primary block" type="submit">Envoyer l'avis</button>
      </form>
    </div>
  </div>

  <!-- Modale signalement -->
  <div id="report-modal" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>Signaler un problème</h2>
        <button class="modal-close" type="button" data-close-modal="report-modal">×</button>
      </div>
      <form class="modal-body" id="report-form">
        <input type="hidden" id="report-demande-id">
        <label>
          <span class="field-label">Motif</span>
          <select class="form-select" id="report-motif" required>
            <option>Comportement non professionnel</option>
            <option>Ne répond pas</option>
            <option>Fausse information</option>
            <option>Retard important</option>
            <option>Problème avec la demande</option>
            <option>Annulation abusive</option>
            <option>Autre</option>
          </select>
        </label>
        <label>
          <span class="field-label">Description</span>
          <textarea class="form-textarea" id="report-description" placeholder="Ajoutez des détails utiles"></textarea>
        </label>
        <button class="btn warning block" type="submit">Envoyer le signalement</button>
      </form>
    </div>
  </div>
</body>
</html>
