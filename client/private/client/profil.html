<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon profil — Taskly</title>
  <link rel="icon" type="image/svg+xml" href="/images/icons/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/client-dashboard.js"></script>
<link rel="stylesheet" href="/css/account-profile.css"><script defer src="/js/account-profile.js"></script><link rel="stylesheet" href="/css/taskly-workspace-forms.css"><script defer src="/js/account-confirmation.js"></script><link rel="stylesheet" href="/css/workspace-pro.css"><script defer src="/js/workspace-dialogs.js"></script>  <link rel="stylesheet" href="/css/client-refonte.css"><link rel="stylesheet" href="/css/client-design-fidele.css">
</head>
<body class="dashboard-page" data-require-role="client" data-workspace-page="profil">
  <div id="site-header"></div>
  <main class="dashboard-shell">
    <!-- Navigation client -->
    <aside class="sidebar">
      <p class="sidebar-title">Espace client</p>
      <nav class="side-nav"><a href="/espace/client/accueil" data-dashboard-link="accueil">Vue d’ensemble</a>
        <a href="/espace/client/demandes" data-dashboard-link="demandes">Mes demandes</a>
        <a href="/espace/client/profil" class="active" aria-current="page" data-dashboard-link="profil">Mon profil</a>
        <a href="/espace/client/support" data-dashboard-link="support">Support</a>
        <button type="button" data-logout>Déconnexion</button>
      </nav>
    </aside>

    <!-- Contenu client -->
    <section class="dashboard-content">
      <div class="client-heading"><div><p class="client-eyebrow">ESPACE CLIENT / INFORMATIONS DU COMPTE</p><h1>Mon profil</h1><p class="client-subtitle">Gérez vos informations personnelles et la sécurité de votre compte.</p></div><span class="client-top-chip">Espace personnel</span></div>
      

      

      
      <div class="dashboard-grid">
        

        <section class="panel" id="profil" data-dashboard-view="profil">
          <div class="panel-header">
            <h2>Mon profil</h2>
          </div>
          <div class="panel-body">
            <div id="client-profile-card"></div>
            <form id="client-photo-form" class="mt-22">
              <label>
                <span class="field-label">Photo de profil</span>
                <input class="form-control" id="client-photo-input" type="file" accept="image/jpeg,image/png">
              </label>
              <div class="request-actions">
                <button class="btn primary" type="submit">Mettre à jour</button>
                <button class="btn danger outline" type="button" id="client-photo-delete">Supprimer</button>
              </div>
            </form><h2 class="client-account-actions-heading">Gérer mon compte</h2><div id="account-profile-editor" class="mt-22"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <!-- Modale avis -->
  

  <!-- Modale signalement -->
  
</body>
</html>
