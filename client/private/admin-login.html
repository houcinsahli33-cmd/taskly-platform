<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Accès privé — Taskly</title>
  <link rel="icon" type="image/svg+xml" href="/images/icons/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin-portal.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/admin-login.js"></script>
</head>
<body class="admin-private-page">
  <main class="admin-private-shell">
    <section class="admin-private-card" aria-label="Connexion sécurisée administrateur">
      <header class="admin-private-header">
        <img class="admin-private-logo" src="/images/logo/taskly-logo.svg" alt="Taskly">
        <span class="admin-private-tag"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg> Espace réservé</span>
        <div class="admin-private-shield" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l7 4v5c0 4.5-2.7 7.6-7 9-4.3-1.4-7-4.5-7-9V7l7-4Z"></path><path d="m9 12 2 2 4-4"></path></svg></div>
        <h1 id="admin-title">Connexion administrateur</h1>
        <p id="admin-description">Accès privé à la gestion des artisans, utilisateurs et signalements.</p>
      </header>

      <form id="admin-login-form" class="admin-private-form" novalidate>
        <label for="admin-email">Adresse e-mail administrateur</label>
        <div class="admin-private-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
          <input id="admin-email" type="email" autocomplete="username" inputmode="email" placeholder="nom@exemple.com" required>
        </div>
        <label for="admin-password">Mot de passe</label>
        <div class="admin-private-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          <input id="admin-password" type="password" autocomplete="current-password" placeholder="Votre mot de passe" required>
          <button type="button" id="admin-toggle-password" class="admin-private-toggle" aria-label="Afficher le mot de passe" aria-pressed="false">Voir</button>
        </div>
        <button class="admin-private-primary" type="submit"><span>Continuer en sécurité</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14 0"></path><path d="m13 6 6 6-6 6"></path></svg></button>
      </form>

      <form id="admin-code-form" class="admin-private-form" hidden novalidate>
        <div class="admin-private-step-info">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span>Code valable <strong>3 minutes</strong></span>
          <span class="admin-private-timer" id="admin-code-timer" role="timer" aria-live="off">03:00</span>
        </div>
        <label for="admin-code">Code reçu par e-mail</label>
        <div class="admin-private-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"></path><path d="M9 9h6"></path><path d="M9 13h3"></path></svg>
          <input id="admin-code" type="text" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" placeholder="000000" required>
        </div>
        <p class="admin-private-help">3 tentatives maximum. Si le code expire, reconnectez-vous pour en demander un autre.</p>
        <button class="admin-private-primary" type="submit"><span>Confirmer et accéder</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14 0"></path><path d="m13 6 6 6-6 6"></path></svg></button>
        <button id="admin-back" class="admin-private-back" type="button">← Retour à la connexion</button>
      </form>

      <p id="admin-alert" class="admin-private-alert" role="status" aria-live="polite"></p>
      <footer class="admin-private-footer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 4v5c0 4.5-2.7 7.6-7 9-4.3-1.4-7-4.5-7-9V7l7-4Z"></path></svg>
        <span>Accès protégé par mot de passe, session sécurisée et code e-mail.</span>
      </footer>
    </section>
  </main>
</body>
</html>
