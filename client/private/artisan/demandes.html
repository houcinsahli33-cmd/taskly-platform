<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes demandes — Taskly</title>
  <link rel="icon" type="image/svg+xml" href="/images/icons/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/artisan-dashboard.js"></script>
  
<link rel="stylesheet" href="/css/account-profile.css"><link rel="stylesheet" href="/css/taskly-workspace-forms.css"><script defer src="/js/account-confirmation.js"></script><link rel="stylesheet" href="/css/workspace-pro.css"><script defer src="/js/workspace-dialogs.js"></script></head>
<body class="dashboard-page" data-require-role="artisan" data-workspace-page="demandes">
  <div id="site-header"></div>
  <main class="dashboard-shell">
    <!-- Navigation artisan -->
    <aside class="sidebar">
      <p class="sidebar-title">Espace artisan</p>
      <nav class="side-nav"><a href="/espace/artisan/accueil" data-dashboard-link="accueil">Vue d’ensemble</a>
        <a href="/espace/artisan/demandes" class="active" aria-current="page" data-dashboard-link="demandes">Demandes reçues</a>
        <a href="/espace/artisan/avis" data-dashboard-link="avis">Avis</a>
        <a href="/espace/artisan/profil" data-dashboard-link="profil">Mon profil</a>
        <a href="/espace/artisan/support" data-dashboard-link="support">Support</a>
        <button type="button" data-logout>Déconnexion</button>
      </nav>
    </aside>

    <!-- Contenu artisan -->
    <section class="dashboard-content">
      <h1 class="dashboard-section-title" id="dashboard-page-title">Demandes reçues</h1>
      

      
      


      
      <div class="dashboard-grid">
        <section class="panel" id="demandes" data-dashboard-view="demandes">
          <div class="panel-header">
            <h2>Demandes reçues</h2>
          </div>
          <div class="panel-body">
            <div class="request-list" id="artisan-requests"></div>
          </div>
        </section>

        

        
      </div>
    </section>
  </main>

  <!-- Modale annulation -->
  <div id="cancel-artisan-modal" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>Annuler la demande</h2>
        <button class="modal-close" type="button" data-close-modal="cancel-artisan-modal">×</button>
      </div>
      <form class="modal-body" id="cancel-artisan-form">
        <input type="hidden" id="cancel-artisan-demande-id">
        <label>
          <span class="field-label">Motif d'annulation</span>
          <textarea class="form-textarea" id="cancel-artisan-reason" required placeholder="Expliquez le motif au client"></textarea>
        </label>
        <button class="btn danger block" type="submit">Annuler avec motif</button>
      </form>
    </div>
  </div>

  <!-- Modale signalement -->
  <div id="artisan-report-modal" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>Signaler un client</h2>
        <button class="modal-close" type="button" data-close-modal="artisan-report-modal">×</button>
      </div>
      <form class="modal-body" id="artisan-report-form">
        <input type="hidden" id="artisan-report-demande-id">
        <label>
          <span class="field-label">Motif</span>
          <select class="form-select" id="artisan-report-motif" required>
            <option>Comportement non professionnel</option>
            <option>Ne répond pas</option>
            <option>Fausse information</option>
            <option>Retard important</option>
            <option>Problème avec la demande</option>
            <option>Annulation abusive</option>
            <option>Autre</option>
          </select>
        </label>
        <label>
          <span class="field-label">Description</span>
          <textarea class="form-textarea" id="artisan-report-description" placeholder="Ajoutez des détails utiles"></textarea>
        </label>
        <button class="btn warning block" type="submit">Envoyer le signalement</button>
      </form>
    </div>
  </div>
</body>
</html>
