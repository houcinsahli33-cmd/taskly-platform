<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes demandes — Taskly</title>
  <link rel="icon" type="image/svg+xml" href="/images/icons/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/auth.js"></script>
  <link rel="stylesheet" href="/css/taskly-chat.css?v=1">
<script defer src="/js/artisan-dashboard.js?v=20261012-2"></script>
<script defer src="/js/taskly-chat.js?v=1"></script>
  
<link rel="stylesheet" href="/css/account-profile.css"><link rel="stylesheet" href="/css/taskly-workspace-forms.css"><script defer src="/js/account-confirmation.js"></script><link rel="stylesheet" href="/css/workspace-pro.css"><script defer src="/js/workspace-dialogs.js"></script><link rel="stylesheet" href="/css/artisan-design-fidele.css?v=20261012-2"><link rel="stylesheet" href="/css/taskly-demandes-detail.css"></head>
<body class="dashboard-page" data-require-role="artisan" data-workspace-page="demandes">
  <div id="site-header"></div>
  <main class="dashboard-shell">
    <!-- Navigation artisan -->
    <aside class="sidebar">
      <p class="sidebar-title">Espace artisan</p>
      <nav class="side-nav"><a href="/espace/artisan/accueil" data-dashboard-link="accueil"><svg class="artisan-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3z"></path><path d="M9 20v-7h6v7"></path></svg>Vue d’ensemble</a>
        <a href="/espace/artisan/demandes" class="active" aria-current="page" data-dashboard-link="demandes"><svg class="artisan-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Demandes reçues</a>
        <a href="/espace/artisan/avis" data-dashboard-link="avis"><svg class="artisan-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11a9 9 0 0 1-9 9H3l2-5a9 9 0 1 1 16-4Z"></path></svg>Avis</a>
        <a href="/espace/artisan/profil" data-dashboard-link="profil"><svg class="artisan-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M4 21c0-5 3-8 8-8s8 3 8 8"></path></svg>Mon profil</a>
        <a href="/espace/artisan/support" data-dashboard-link="support"><svg class="artisan-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5M12 17v1"></path></svg>Support</a>
        <button type="button" data-logout><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 7l5 5-5 5M20 12H9"></path></svg>Déconnexion</button>
      </nav>
    </aside>

    <!-- Contenu artisan -->
    <section class="dashboard-content">
      <div class="artisan-upper"><p class="artisan-eyebrow">ESPACE ARTISAN &nbsp; / &nbsp; MISSIONS</p><h1 class="dashboard-section-title" id="dashboard-page-title">Demandes reçues</h1><p class="artisan-subtitle">Examinez les demandes des clients et suivez chaque prestation.</p></div>
      

      
      


      
      <div class="stats-grid" id="artisan-demandes-stats"></div><div class="dashboard-grid">
        <section class="panel" id="demandes" data-dashboard-view="demandes">
          <div class="panel-header">
            <h2>Demandes reçues</h2>
          </div>
          <div class="panel-body">
            <div class="artisan-filter-bar"><div role="group" aria-label="Filtrer les demandes"><button type="button" class="artisan-filter active" data-artisan-filter="" aria-pressed="true">Toutes</button><button type="button" class="artisan-filter" data-artisan-filter="en_attente" aria-pressed="false">En attente</button><button type="button" class="artisan-filter" data-artisan-filter="acceptee" aria-pressed="false">Acceptées</button><button type="button" class="artisan-filter" data-artisan-filter="terminee" aria-pressed="false">Terminées</button><button type="button" class="artisan-filter" data-artisan-filter="refusee" aria-pressed="false">Refusées</button></div><input class="form-control" id="artisan-request-search" type="search" aria-label="Rechercher une demande" placeholder="Rechercher un client ou une demande"></div><div class="request-list" id="artisan-requests"></div>
          </div>
        </section>

        

        
      </div>
    </section>
  </main>

  <!-- Modale annulation -->
  <div id="cancel-artisan-modal" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>Annuler la demande</h2>
        <button class="modal-close" type="button" data-close-modal="cancel-artisan-modal">×</button>
      </div>
      <form class="modal-body" id="cancel-artisan-form">
        <input type="hidden" id="cancel-artisan-demande-id">
        <label>
          <span class="field-label">Motif d'annulation</span>
          <textarea class="form-textarea" id="cancel-artisan-reason" required placeholder="Expliquez le motif au client"></textarea>
        </label>
        <button class="btn danger block" type="submit">Annuler avec motif</button>
      </form>
    </div>
  </div>

  <!-- Modale signalement -->
  <div id="artisan-report-modal" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>Signaler un client</h2>
        <button class="modal-close" type="button" data-close-modal="artisan-report-modal">×</button>
      </div>
      <form class="modal-body" id="artisan-report-form">
        <input type="hidden" id="artisan-report-demande-id">
        <label>
          <span class="field-label">Motif</span>
          <select class="form-select" id="artisan-report-motif" required>
            <option>Comportement non professionnel</option>
            <option>Ne répond pas</option>
            <option>Fausse information</option>
            <option>Retard important</option>
            <option>Problème avec la demande</option>
            <option>Annulation abusive</option>
            <option>Autre</option>
          </select>
        </label>
        <label>
          <span class="field-label">Description</span>
          <textarea class="form-textarea" id="artisan-report-description" placeholder="Ajoutez des détails utiles"></textarea>
        </label>
        <button class="btn warning block" type="submit">Envoyer le signalement</button>
      </form>
    </div>
  </div>
</body>
</html>
