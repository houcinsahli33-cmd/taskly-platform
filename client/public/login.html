<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Taskly</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/algeria-locations.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/auth-pages.js"></script>
</head>
<body class="auth-page" data-auth-page="true">
  <main class="auth-card">
    <section class="auth-aside">
      <a class="brand auth-logo" href="/index.html"><img src="/images/taskly-logo.svg" alt="Taskly"></a>
      <h1 style = "margin-bottom: 20px;">Votre espace Taskly</h1>
      <p class="muted text-soft-green mt-22">Vous êtes artisan ? Utilisez la page dédiée pour créer un profil professionnel.</p>
      <a class="btn light mt-22" href="/become-artisan.html">Devenir artisan</a>
    </section>

    <section class="auth-body">
      <div class="auth-panel active">
        <h2>Connexion</h2>
        <p class="muted mb-20">Accédez à votre espace client, artisan ou administrateur.</p>
        <div id="login-alert" class="alert"></div>
        <form id="login-form" class="grid" novalidate>
          <label>
            <span class="field-label">Email</span>
            <input class="form-control" id="login-email" type="email" required placeholder="Adresse e-mail">
          </label>
          <label>
            <span class="field-label">Mot de passe</span>
            <input class="form-control" id="login-password" type="password" required placeholder="Mot de passe">
          </label>
          <button class="btn primary block" type="submit">Se connecter</button>
        </form>
        <p class="auth-small-link">Vous n'avez pas encore de compte ? <a href="/register.html">S'inscrire</a></p>
      </div>
    </section>
  </main>
</body>
</html>
