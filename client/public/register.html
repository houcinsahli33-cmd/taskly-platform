<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription client - Taskly</title>
  <link rel="icon" type="image/svg+xml" href="/images/icons/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/algeria-locations.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/auth-pages.js"></script>
</head>
<body class="auth-page" data-auth-page="true">
  <!-- Carte inscription -->
  <main class="auth-card">
    <section class="auth-aside">
      <a class="brand auth-logo" href="/index.html"><img src="/images/logo/taskly-logo.svg" alt="Taskly"></a>
      <h1>Votre espace Taskly</h1>
      <p class="muted text-soft-green mt-22">Vous êtes artisan ? Utilisez la page dédiée pour créer un profil professionnel.</p>
      <a class="btn light mt-22" href="/become-artisan.html">Devenir artisan</a>
    </section>

    <section class="auth-body">
      <div class="auth-panel active">
        <h2>Créer votre compte client</h2>
        <p class="muted mb-20">Créez votre compte pour accéder à tous nos services.</p>
        <div id="client-register-alert" class="alert"></div>
        <form id="client-register-form" class="form-grid" novalidate>
          <label>
            <span class="field-label">Nom</span>
            <input class="form-control" id="client-nom" required placeholder="Nom">
          </label>
          <label>
            <span class="field-label">Prénom</span>
            <input class="form-control" id="client-prenom" required placeholder="Prénom">
          </label>
          <label>
            <span class="field-label">Email</span>
            <div class="field-with-status">
              <input class="form-control" id="client-email" type="email" required placeholder="Adresse e-mail">
              <span class="field-status-icon" id="client-email-status" aria-hidden="true"></span>
            </div>
          </label>
          <label>
            <span class="field-label password-label-row">
              <span>Mot de passe</span>
              <span class="password-strength-text" id="client-password-strength-text"></span>
            </span>
            <div class="field-with-status">
              <input class="form-control" id="client-password" type="password" required placeholder="Mot de passe">
              <button class="password-toggle-btn" type="button" data-password-toggle="client-password" aria-label="Afficher le mot de passe">👁</button>
            </div>
            <div class="password-strength-bars" data-password-strength="client-password">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </label>
          <label>
            <span class="field-label">Téléphone</span>
            <input class="form-control" id="client-phone" required placeholder="Numéro de téléphone">
          </label>
          <label>
            <span class="field-label">Wilaya</span>
            <select class="form-select" id="client-wilaya" required></select>
          </label>
          <label>
            <span class="field-label">Commune</span>
            <select class="form-select" id="client-commune" required>
              <option value="">Choisir une commune</option>
            </select>
          </label>
          <label>
            <span class="field-label">Adresse</span>
            <input class="form-control" id="client-address" required placeholder="Adresse complète">
          </label>
          <button class="btn primary block full" type="submit">Créer mon compte</button>
        </form>
        <p class="auth-small-link">Vous avez d&eacute;j&agrave; un compte ? <a href="/login.html">Se connecter</a></p>
      </div>
    </section>
  </main>
</body>
</html>
